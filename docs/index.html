<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF7 Bonus Disc — English Translation · Screenshots</title>
<meta name="description" content="Screenshots of the English fan translation of the Final Fantasy VII International Perfect Guide bonus disc.">
<style>
  :root { --bg: #0b0d14; --panel: #151a2b; --ink: #e8e6df; --dim: #9aa0b4; --accent: #6ea8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1200px; margin: 0 auto; padding: 32px 20px 12px; }
  h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: .01em; }
  header p { margin: 0; color: var(--dim); }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .links { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .links a { display: inline-block; padding: 7px 14px; border-radius: 6px; background: var(--panel);
    border: 1px solid #263052; color: var(--ink); }
  .links a.primary { background: #23408a; border-color: #3a5fc0; }
  .links a:hover { text-decoration: none; filter: brightness(1.15); }

  main { max-width: 1200px; margin: 0 auto; padding: 12px 20px 48px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .thumb { all: unset; display: block; cursor: zoom-in; border-radius: 6px; overflow: hidden;
    background: #000; aspect-ratio: 2010 / 1475; outline-offset: 3px;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); transition: transform .15s ease; }
  .thumb:hover { transform: translateY(-2px); }
  .thumb:focus-visible { outline: 2px solid var(--accent); }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  footer { text-align: center; color: var(--dim); font-size: .85rem; padding: 0 20px 32px; }

  /* lightbox */
  .lb { position: fixed; inset: 0; background: rgba(4,5,9,.94); display: none;
    align-items: center; justify-content: center; z-index: 10; touch-action: pan-y; }
  .lb.open { display: flex; }
  .lb img { max-width: 96vw; max-height: 88vh; object-fit: contain; user-select: none;
    -webkit-user-drag: none; box-shadow: 0 6px 40px rgba(0,0,0,.7); transition: transform .2s ease, opacity .2s ease; }
  .lb button { position: absolute; background: rgba(21,26,43,.8); color: var(--ink); border: 1px solid #2c375c;
    border-radius: 50%; width: 48px; height: 48px; font-size: 22px; line-height: 1; cursor: pointer; }
  .lb button:hover { background: rgba(35,64,138,.9); }
  .lb .prev { left: 14px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 14px; top: 50%; transform: translateY(-50%); }
  .lb .close { top: 14px; right: 14px; }
  .lb .count { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: .9rem; }
  @media (hover: none) { .lb .prev, .lb .next { display: none; } }
</style>
</head>
<body>
<header>
  <h1>FF7 Bonus Disc — English Translation</h1>
  <p>Screenshots of the English patch for the <em>Final Fantasy VII International</em> “Perfect Guide” disc, shown with a CRT filter. Tap any shot to view it full size.</p>
  <div class="links">
    <a class="primary" href="https://github.com/Adlai-Holler/ff7-bonus-disc-en/releases/latest">Download the patch</a>
    <a href="https://github.com/Adlai-Holler/ff7-bonus-disc-en">Project on GitHub</a>
  </div>
</header>

<main id="grid"></main>

<footer>Unofficial fan project, not affiliated with Square Enix.</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
  <img id="lbimg" alt="">
  <button class="prev" id="prev" aria-label="Previous screenshot">‹</button>
  <button class="next" id="next" aria-label="Next screenshot">›</button>
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="count" id="count"></div>
</div>

<script>
  const shots = ['10','20','30','31','32','40','50','60','70','80','90','100','110','120','130','140','141','142','145','150'];
  const grid = document.getElementById('grid');
  shots.forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.setAttribute('aria-label', `Open screenshot ${i + 1} of ${shots.length}`);
    b.innerHTML = `<img src="thumbs/${n}.webp" alt="Screenshot ${i + 1}" loading="lazy" width="640" height="470">`;
    b.addEventListener('click', () => open(i));
    grid.appendChild(b);
  });

  const lb = document.getElementById('lb'), img = document.getElementById('lbimg'), count = document.getElementById('count');
  let cur = 0, lastFocus = null;

  function show(i) {
    cur = (i + shots.length) % shots.length;
    img.src = `shots/${shots[cur]}.webp`;
    img.alt = `Screenshot ${cur + 1}`;
    count.textContent = `${cur + 1} / ${shots.length}`;
    [cur - 1, cur + 1].forEach(j => { const p = new Image(); p.src = `shots/${shots[(j + shots.length) % shots.length]}.webp`; });
  }
  function open(i) {
    lastFocus = document.activeElement;
    show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden';
    document.getElementById('close').focus();
  }
  function close() {
    lb.classList.remove('open'); document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }

  document.getElementById('prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
  document.getElementById('next').onclick = e => { e.stopPropagation(); show(cur + 1); };
  document.getElementById('close').onclick = e => { e.stopPropagation(); close(); };
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === 'ArrowRight') show(cur + 1);
  });

  // swipe left/right to move, swipe down to close
  let sx = 0, sy = 0, swiping = false;
  lb.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; swiping = true; }, { passive: true });
  lb.addEventListener('touchmove', e => {
    if (!swiping) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    img.style.transition = 'none';
    img.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${Math.max(0, dy)}px)`;
  }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (!swiping) return; swiping = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    img.style.transition = ''; img.style.transform = '';
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
    else if (dy > 80 && dy > Math.abs(dx)) close();
  });
</script>
</body>
</html>
